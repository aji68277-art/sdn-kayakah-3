function buatJurnalPerBulan(){
  var hasil=[];
  var pointer={};
  function ambilMateri(kls, sem){
    if(pointer[kls]==null) pointer[kls]=0;
    var list=JUDUL_PRAMUKA[kls][sem];
    var materi=list[pointer[kls] % list.length];
    pointer[kls]++;
    return materi;
  }
  function kelasAktifBulan(bulanKey){
    if(bulanKey<"2027-01") return ["Kelas 4","Kelas 5","Kelas 6"];
    return ["Kelas 1","Kelas 2","Kelas 3","Kelas 4","Kelas 5","Kelas 6"];
  }
  JURNAL_BULAN_LIST.forEach(function(bulanKey){
    var parts=bulanKey.split("-"); var y=parseInt(parts[0]), m=parseInt(parts[1])-1;
    var sem = bulanKey<"2027-01" ? "Ganjil" : "Genap";
    if(bulanKey==="2027-01"){ pointer={}; }
    var d=new Date(y,m,1); if(bulanKey==="2026-07") d=new Date(2026,6,13);
    while(d.getMonth()===m){
      var hari=d.getDay();
      if(hari===6){
        kelasAktifBulan(bulanKey).forEach(function(kls){
          var materi=ambilMateri(kls, sem);
          var tglStr=NAMA_HARI[hari]+", "+d.getDate()+" "+JURNAL_BULAN_LABEL[bulanKey];
          hasil.push({bulan:bulanKey,kelas:kls,tgl:tglStr,mapel:"Pramuka - "+kls,materi:materi,kegiatan:"Upacara pembukaan, doa, absen 10 menit. Inti: Materi, demo, latihan kelompok, game "+materi.toLowerCase()+" 60 menit. Penutup: Refleksi, doa, upacara penutupan 10 menit.",kendala:"-",refleksi:"Anak antusias, disiplin, kerjasama regu bagus.",tindak:"Lanjutkan / ulangi jika perlu."});
        });
      }
      d.setDate(d.getDate()+1);
    }
  });
  return hasil;
}

function getNilai(nama){var k=kunciNilai();var data=NILAI_DATA[k]||{};var v=data[nama]||{uh1:'',uh2:'',uh3:'',uh4:'',uh5:'',uh6:'',sts:'',sas:''};var arr=[v.uh1,v.uh2,v.uh3,v.uh4,v.uh5,v.uh6,v.sts,v.sas].map(function(x){return parseFloat(x)}).filter(function(x){return !isNaN(x)});var rata=arr.length?arr.reduce(function(a,b){return a+b},0)/arr.length:0;return {v:v,rata:rata};}
function hitungRanking(){var list=DATA_SISWA[kelasAktif].map(function(nama){return {nama:nama,rata:getNilai(nama).rata}});list.sort(function(a,b){return b.rata-a.rata});var map={},rank=0,prev=-1;list.forEach(function(x,i){if(x.rata!==prev){rank=i+1;prev=x.rata;}map[x.nama]=x.rata>0?rank:'-';});return map;}
function ubahNilai(el,idx,kol,val,nama){if(!cekGuru()){render();return;}var k=kunciNilai();if(!NILAI_DATA[k])NILAI_DATA[k]={};if(!NILAI_DATA[k][nama])NILAI_DATA[k][nama]={uh1:'',uh2:'',uh3:'',uh4:'',uh5:'',uh6:'',sts:'',sas:''};NILAI_DATA[k][nama][kol]=val;localStorage.setItem('PRAMUKA_NILAI',JSON.stringify(NILAI_DATA));render();}

  }
  if(adminAktif==="PRESENSI"){if(!MODE_GURU){isi='<div style="text-align:center;padding:20px"><div style="font-size:60px">🔒</div><h2>PRESENSI DIKUNCI</h2><p>Hanya Pembina Pramuka yang bisa buka.</p></div>';}else{var bulanObj=BULAN_LIST.find(function(b){return b.key===bulanAktif});var tanggalList=getTanggalSabtu(bulanAktif);var opsiBulan=BULAN_LIST.map(function(b){return '<option value="'+b.key+'" '+(b.key===bulanAktif?'selected':'')+'>'+b.label+'</option>';}).join('');isi='<h3>📋 PRESENSI PRAMUKA - '+esc(kelasAktif)+' - PER BULAN - Sabtu</h3><div class="box">SDN Kayakah - Pembina: Wahyu Aji, S.Pd.Jas & M. Husain - H=Hadir, S=Sakit, I=Izin, A=Alpa</div><label>Pilih Bulan</label><select onchange="pilihBulan(this.value)">'+opsiBulan+'</select><h3>'+bulanObj.label+' - '+tanggalList.length+' Pertemuan (Sabtu)</h3><p>Tanggal Pramuka: <b>'+tanggalList.join(', ')+'</b></p><div class="presensiWrap"><table><tr><th>No</th><th>Nama</th>'+tanggalList.map(function(t){return '<th>'+t+'</th>';}).join('')+'</tr>'+DATA_SISWA[kelasAktif].map(function(nama,idx){return '<tr><td>'+(idx+1)+'</td><td style="white-space:nowrap"><b>'+esc(nama)+'</b></td>'+tanggalList.map(function(tgl,j){return '<td><select><option value="H">H</option><option value="S">S</option><option value="I">I</option><option value="A">A</option></select></td>';}).join('')+'</tr>';}).join('')+'</table></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn2" style="background:#059669;flex:1" onclick="alert(\'Presensi tersimpan!\')">💾 SIMPAN</button><button class="btn2" style="background:#25D366;flex:1" onclick="window.open(\'https://wa.me/?text=\'+encodeURIComponent(\'Presensi Pramuka - '+kelasAktif+' - \'+bulanObj.label),\'_blank\')">💬 WA</button><button class="btn2" style="background:#FF4757;flex:1" onclick="window.print()">🖨️ PRINT</button></div>';}}

"window.print()">🖨️ PRINT</button></div>';}}
