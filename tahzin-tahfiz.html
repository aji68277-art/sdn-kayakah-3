function buatJurnalPerBulan(){
  var hasil=[];
  var pointer={};
  function ambilMateri(kls, sem){
    if(pointer[kls]==null) pointer[kls]=0;
    var list=JUDUL_TAHSIN[kls][sem];
    var materi=list[pointer[kls] % list.length];
    pointer[kls]++;
    return materi;
  }
  JURNAL_BULAN_LIST.forEach(function(bulanKey){
    var parts=bulanKey.split("-"); var y=parseInt(parts[0]), m=parseInt(parts[1])-1;
    var sem = bulanKey<"2027-01" ? "Ganjil" : "Genap";
    if(bulanKey==="2027-01"){ pointer={}; }
    var d=new Date(y,m,1); if(bulanKey==="2026-07") d=new Date(2026,6,13);
    while(d.getMonth()===m){
      var hari=d.getDay();
      if(HARI_TAHSIN.indexOf(hari)!==-1){
        Object.keys(JUDUL_TAHSIN).forEach(function(kls){
          var materi=ambilMateri(kls, sem);
          var tglStr=NAMA_HARI[hari]+", "+d.getDate()+" "+JURNAL_BULAN_LABEL[bulanKey];
          hasil.push({bulan:bulanKey,kelas:kls,tgl:tglStr,mapel:"Tahsin-Tahfiz - "+kls,materi:materi,kegiatan:"Doa, absen, apersepsi 10 menit. Inti: Talqin, tiru guru, setoran per anak, murajaah "+materi.toLowerCase()+" 60 menit. Penutup: Refleksi, doa 10 menit.",kendala:"-",refleksi:"Anak antusias, aktif setoran dan murajaah.",tindak:"Lanjutkan / ulangi jika perlu."});
        });
      }
      d.setDate(d.getDate()+1);
    }
  });
  return hasil;
}

function updateTombolLogin(){var b=document.getElementById('tombolLogin');if(b){b.innerText=MODE_GURU?'✅ GURU TAHSIN - LOGOUT':'🔐 LOGIN GURU TAHSIN';b.style.background=MODE_GURU?'#059669':'#222';}var g=document.getElementById('tombolGantiPin');if(g)g.style.display=MODE_GURU?'inline-block':'none';}
function getTanggalTahsin(key){var p=key.split('-');var y=parseInt(p[0]),m=parseInt(p[1])-1;var res=[];var d=new Date(y,m,1);while(d.getMonth()===m){if(HARI_TAHSIN.indexOf(d.getDay())!==-1)res.push(d.getDate());d.setDate(d.getDate()+1);}return res;}
function kunciNilai(){return kelasAktif+"|"+nilaiSemAktif;}
function pilihNilaiSem(s){nilaiSemAktif=s;render();}
function getNilai(nama){var k=kunciNilai();var data=NILAI_DATA[k]||{};var v=data[nama]||{uh1:'',uh2:'',uh3:'',uh4:'',uh5:'',uh6:'',sts:'',sas:''};var arr=[v.uh1,v.uh2,v.uh3,v.uh4,v.uh5,v.uh6,v.sts,v.sas].map(function(x){return parseFloat(x)}).filter(function(x){return !isNaN(x)});var rata=arr.length?arr.reduce(function(a,b){return a+b},0)/arr.length:0;return {v:v,rata:rata};}
function hitungRanking(){var list=DATA_SISWA[kelasAktif].map(function(nama){return {nama:nama,rata:getNilai(nama).rata}});list.sort(function(a,b){return b.rata-a.rata});var map={},rank=0,prev=-1;list.forEach(function(x,i){if(x.rata!==prev){rank=i+1;prev=x.rata;}map[x.nama]=x.rata>0?rank:'-';});return map;}
function ubahNilai(el,idx,kol,val,nama){if(!cekGuru()){render();return;}var k=kunciNilai();if(!NILAI_DATA[k])NILAI_DATA[k]={};if(!NILAI_DATA[k][nama])NILAI_DATA[k][nama]={uh1:'',uh2:'',uh3:'',uh4:'',uh5:'',uh6:'',sts:'',sas:''};NILAI_DATA[k][nama][kol]=val;localStorage.setItem('TAHSIN_NILAI',JSON.stringify(NILAI_DATA));render();}
function simpanNilai(){if(!cekGuru())return;localStorage.setItem('TAHSIN_NILAI',JSON.stringify(NILAI_DATA));alert('Nilai tersimpan!');}
function simpanEditJurnal(i){if(!cekGuru())return;JURNAL_DATA[i]={bulan:JURNAL_DATA[i].bulan,kelas:JURNAL_DATA[i].kelas,tgl:document.getElementById('je-tgl').value,mapel:document.getElementById('je-mapel').value,materi:document.getElementById('je-materi').value,kegiatan:document.getElementById('je-kegiatan').value,kendala:document.getElementById('je-kendala').value,refleksi:document.getElementById('je-refleksi').value,tindak:document.getElementById('je-tindak').value};simpanJurnal();JURNAL_EDIT_IDX=-1;alert('Jurnal tersimpan!');render();}

    isi='<h3>📚 MATERI TAHSIN-TAHFIZ + MODUL - '+esc(kelasAktif)+' - '+FASE[kelasAktif]+' - Semester '+semMateri+' - Selasa, Rabu, Kamis</h3><div class="no-print">'+semBtn+'</div>'+list;
  }

      return '<div class="box"><b>'+esc(j.tgl)+'</b> - '+esc(j.mapel)+' - <b>'+esc(j.materi)+'</b><br><b>Kegiatan:</b> '+esc(j.kegiatan)+'<br><b>Kendala:</b> '+esc(j.kendala)+'<br><b>Refleksi:</b> '+esc(j.refleksi)+'<br><b>Tindak Lanjut:</b> '+esc(j.tindak)+'<br><div class="no-print">'+(MODE_GURU?'<button class="btn2" style="background:#1E90FF" onclick="JURNAL_EDIT_IDX='+i+';render()">✏️ EDIT</button><button class="btn2" style="background:#D32F2F" onclick="hapusJurnal('+i+')">🗑️ HAPUS</button>':'<span style="font-size:12px;color:#888">🔒 Login guru untuk edit</span>')+'</div></div>';
    }).join('');

  }

  if(adminAktif==="NILAI"){if(!MODE_GURU){isi='<div style="text-align:center;padding:20px"><div style="font-size:60px">🔒</div><h2>NILAI DIKUNCI</h2><p>Hanya Guru Tahsin yang bisa buka.</p></div>';}else{var materi=JUDUL_TAHSIN[kelasAktif][nilaiSemAktif].slice(0,6);var mapRank=hitungRanking();var headN='<th>UH 1<br><small>'+esc(materi[0])+'</small></th><th>UH 2<br><small>'+esc(materi[1])+'</small></th><th>UH 3<br><small>'+esc(materi[2])+'</small></th><th>UH 4<br><small>'+esc(materi[3])+'</small></th><th>UH 5<br><small>'+esc(materi[4])+'</small></th><th>UH 6<br><small>'+esc(materi[5])+'</small></th><th>STS</th><th>'+(nilaiSemAktif==='Ganjil'?'SAS':'SAT')+'</th>';var rowsN=DATA_SISWA[kelasAktif].map(function(nama,idx){var hv=getNilai(nama);var v=hv.v;var cells=['uh1','uh2','uh3','uh4','uh5','uh6','sts','sas'].map(function(col){return '<td><input class="in-nilai" type="number" min="0" max="100" value="'+v[col]+'" oninput="ubahNilai(this,'+idx+',\''+col+'\',this.value,\''+nama.replace(/\'/g,'')+'\')"></td>';}).join('');return '<tr><td>'+(idx+1)+'. <b>'+esc(nama)+'</b></td>'+cells+'<td><b>'+(hv.rata?hv.rata.toFixed(0):'-')+'</b></td><td>🏆 '+(mapRank[nama]==='-'?'-':mapRank[nama])+'</td></tr>';}).join('');isi='<h3>🏆 NILAI TAHSIN-TAHFIZ - '+esc(kelasAktif)+' - Semester '+nilaiSemAktif+'</h3><div class="box">SDN Kayakah - Guru: Pathul Jannah, S.Pd.I - Nilai tersimpan otomatis di HP.</div><div class="no-print"><select onchange="pilihNilaiSem(this.value)"><option value="Ganjil" '+(nilaiSemAktif==='Ganjil'?'selected':'')+'>🍂 Ganjil</option><option value="Genap" '+(nilaiSemAktif==='Genap'?'selected':'')+'>🌸 Genap</option></select></div><div class="nilaiWrap"><table><tr><th>Nama</th>'+headN+'<th>Nilai</th><th>Ranking</th></tr>'+rowsN+'</table></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn2" style="background:#059669;flex:1" onclick="simpanNilai()">💾 SIMPAN</button><button class="btn2" style="background:#FF4757;flex:1" onclick="window.print()">🖨️ PRINT</button></div>';}}
  el.innerHTML='<h2>📖 TAHSIN-TAHFIZ - '+esc(kelasAktif)+' - Selasa, Rabu, Kamis - Guru: Pathul Jannah, S.Pd.I - '+DATA_SISWA[kelasAktif].length+' Siswa - Wali: '+WALI[kelasAktif]+'</h2><p><b>Siswa:</b> '+DATA_SISWA[kelasAktif].join(', ')+'</p>'+menuAdmin+isi;
