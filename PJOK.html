function hitungRekap(){

function fallbackSalin(teks){
  var ta=document.createElement('textarea'); ta.value=teks; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); alert('Sudah tercopy, Pak! Tinggal Paste di WA, Pak!'); }catch(e){ prompt('Copy manual, Pak. Blok lalu Salin:', teks); } document.body.removeChild(ta);
}
function teruskanWA(){
  if(!cekGuru('TERUSKAN WA')) return;
  var teks=buatTeksPresensi();
  var url='https://wa.me/?text='+encodeURIComponent(teks);
  window.open(url, '_blank');
}
function downloadPresensiBulan(){
  if(!cekGuru('DOWNLOAD')) return;
  var k=kelasAktif; var bulanObj=BULAN_LIST.find(b=>b.key===bulanAktif);
  var data=ambilDataPresensi();
  var csv=`PRESENSI PJOK - SDN KAYAKAH\n${k} - ${bulanObj.label}\nHari: ${HARI[k]} - Guru PJOK: Wahyu Aji, S.Pd.Jas\n\n`;
  csv+=`No,Nama Siswa,${data.tanggalList.map(t=>`Tanggal ${t}`).join(',')},H,S,I,A\n`;
  data.hasil.forEach((s,i)=>{ csv+=`${i+1},"${s.nama}",${s.arr.join(',')},${s.h},${s.s},${s.i},${s.a}\n`; });
  var totalH=0,totalS=0,totalI=0,totalA=0; data.hasil.forEach(s=>{ totalH+=s.h; totalS+=s.s; totalI+=s.i; totalA+=s.a; });
  csv+=`\nRekap,Total Tanda Hadir: ${totalH} dari ${DATA_SISWA[k].length * data.tanggalList.length},Sakit: ${totalS},Izin: ${totalI},Alpa: ${totalA}\n`;
  csv+=`Guru PJOK,Wahyu Aji, S.Pd.Jas\nKepala Sekolah,Wahyu Aji, S.Pd.Jas\n`;
  var blob=new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=`Presensi-PJOK-${k.replace(' ','-')}-${bulanAktif}.csv`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  alert('File Excel sudah terdownload, Pak! Cek di Download HP Pian, Pak!');
}
function cobaPrint(){
  if(!cekGuru('PRINT / PDF')) return;
  window.print();
}
