function buatJurnalPerBulan(){
  var hasil=[];
  var pointer={};
  function ambilMateri(mapel, sem){
    if(pointer[mapel]==null) pointer[mapel]=0;
    var list=JUDUL[mapel][sem];
    var materi=list[pointer[mapel] % list.length];
    pointer[mapel]++;
    return materi;
  }
  JURNAL_BULAN_LIST.forEach(function(bulanKey){
    var parts=bulanKey.split("-"); var y=parseInt(parts[0]), m=parseInt(parts[1])-1;
    var sem = (m>=6) ? "Ganjil" : "Genap";
    if(bulanKey==="2027-01"){ pointer={}; }
    var d=new Date(y,m,1); if(bulanKey==="2026-07") d=new Date(2026,6,13);
    while(d.getMonth()===m){
      var hari=d.getDay();
      var jadwalHari=JADWAL_GURU_KELAS[hari];
      if(jadwalHari){
        jadwalHari.forEach(function(slot){
          var materi=ambilMateri(slot.mapel, sem);
          var tglStr=NAMA_HARI[hari]+", "+d.getDate()+" "+JURNAL_BULAN_LABEL[bulanKey]+" - "+slot.jam;
          hasil.push({bulan:bulanKey,tgl:tglStr,mapel:slot.mapel,materi:materi,kegiatan:"Doa, absen, apersepsi 10 menit. Inti: Mengamati, tanya jawab, diskusi kelompok, analisis, latihan, presentasi "+materi.toLowerCase()+" 60 menit. Penutup: Refleksi, doa 10 menit.",kendala:"-",refleksi:"Anak antusias, aktif diskusi, menganalisis dan presentasi. Siap Ujian Sekolah.",tindak:"Lanjutkan / ulangi jika perlu."});
        });
      }
      d.setDate(d.getDate()+1);
    }
  });
  return hasil;
}
